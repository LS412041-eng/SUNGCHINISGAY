<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vaultly - 雲端收藏庫</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 隱藏元素用的 class */
        .hidden-view { display: none !important; }
        /* 移除數字輸入框的上下箭頭 */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-[#F8F9FA] text-[#1D1D1F] font-sans antialiased min-h-screen">

    <!-- 1. 載入中畫面 -->
    <div id="loading-screen" class="h-screen flex items-center justify-center bg-gray-50">
        <i data-lucide="loader-2" class="w-8 h-8 animate-spin text-blue-500"></i>
    </div>

    <!-- 2. 登入畫面 -->
    <div id="login-screen" class="hidden-view min-h-screen flex flex-col items-center justify-center">
        <div class="bg-white p-10 rounded-[3rem] shadow-2xl text-center max-w-md w-full mx-4 border border-gray-100">
            <div class="w-16 h-16 bg-black rounded-2xl flex items-center justify-center text-white font-bold text-2xl mx-auto mb-6 shadow-lg">V</div>
            <h1 class="text-3xl font-black mb-2 tracking-tight">Vaultly</h1>
            <p class="text-gray-500 mb-10 font-medium">您的數位私人珍藏庫</p>
            <button id="btn-login" class="w-full bg-white border-2 border-gray-200 text-black py-4 rounded-2xl font-bold text-lg hover:border-black hover:bg-gray-50 transition-all flex items-center justify-center gap-3">
                <svg class="w-6 h-6" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                使用 Google 登入
            </button>
        </div>
    </div>

    <!-- 3. 主應用程式畫面 -->
    <div id="main-app" class="hidden-view pb-20">
        <!-- 導覽列 -->
        <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 bg-black rounded-lg flex items-center justify-center text-white font-bold">V</div>
                    <span class="text-xl font-bold tracking-tight">Vaultly</span>
                </div>
                <div class="relative w-64 hidden md:block">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 w-4 h-4"></i>
                    <input id="search-input" type="text" placeholder="搜尋收藏..." class="w-full bg-gray-100 border-none rounded-full py-2 pl-10 pr-4 text-sm focus:ring-2 focus:ring-black outline-none" />
                </div>
                <div class="flex items-center gap-4">
                    <div class="hidden sm:flex items-center gap-2 mr-2">
                        <img id="user-avatar" src="https://via.placeholder.com/32" alt="avatar" class="w-8 h-8 rounded-full border border-gray-200" />
                        <span id="user-name" class="text-sm font-bold truncate max-w-[100px]">用戶</span>
                    </div>
                    <button id="btn-logout" class="text-sm text-gray-500 font-medium hover:text-black transition-colors">登出</button>
                    <button id="btn-open-modal" class="bg-black text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-gray-800 transition-all flex items-center gap-1">
                        <i data-lucide="plus" class="w-4 h-4"></i> 新增
                    </button>
                </div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-6 py-10">
            <!-- 數據統計 -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center">
                        <i data-lucide="box" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">總收藏數</p>
                        <h3 id="stat-count" class="text-2xl font-black">0 件</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 bg-green-50 text-green-600 rounded-2xl flex items-center justify-center">
                        <i data-lucide="dollar-sign" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">總估值 (TWD)</p>
                        <h3 id="stat-value" class="text-2xl font-black">$0</h3>
                    </div>
                </div>
                <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 flex items-center gap-4">
                    <div class="w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center">
                        <i data-lucide="star" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 font-bold uppercase tracking-wider">平均評分</p>
                        <h3 id="stat-rating" class="text-2xl font-black">0 / 5.0</h3>
                    </div>
                </div>
            </section>

            <!-- 列表渲染區 -->
            <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- 收藏卡片將透過 JS 動態生成在這裡 -->
            </div>
        </main>
    </div>

    <!-- 4. 新增對話框 Modal -->
    <div id="add-modal" class="hidden-view fixed inset-0 z-50 flex items-center justify-center p-4">
        <div id="modal-overlay" class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
        <div class="relative bg-white w-full max-w-lg rounded-[3rem] shadow-2xl overflow-hidden transition-all duration-200 transform scale-100">
            <div class="p-10">
                <div class="flex justify-between items-center mb-8">
                    <h2 class="text-3xl font-black">建立收藏</h2>
                    <button id="btn-close-modal" class="p-2 hover:bg-gray-100 rounded-full"><i data-lucide="x"></i></button>
                </div>

                <form id="add-form" class="space-y-6">
                    <!-- 圖片預覽/上傳 -->
                    <div id="image-upload-container" class="h-40 bg-gray-50 border-2 border-dashed border-gray-200 rounded-3xl flex flex-col items-center justify-center cursor-pointer overflow-hidden group">
                        <div id="image-placeholder" class="flex flex-col items-center">
                            <i data-lucide="image" class="w-8 h-8 text-gray-300 group-hover:text-gray-400 mb-2"></i>
                            <p class="text-xs font-bold text-gray-400">點擊上傳照片 (Max 800KB)</p>
                        </div>
                        <img id="image-preview" src="" class="hidden-view w-full h-full object-cover" />
                        <input id="img-input" type="file" accept="image/*" class="hidden" />
                    </div>

                    <div class="space-y-4">
                        <input id="input-name" type="text" required placeholder="收藏品名稱" class="w-full bg-gray-50 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-black" />
                        <div class="grid grid-cols-2 gap-4">
                            <input id="input-price" type="number" required placeholder="價格 (TWD)" class="w-full bg-gray-50 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-black" />
                            <select id="input-category" class="w-full bg-gray-50 rounded-2xl p-4 outline-none focus:ring-2 focus:ring-black appearance-none">
                                <option value="一般">一般</option>
                                <option value="電子產品">電子產品</option>
                                <option value="藝術品">藝術品</option>
                                <option value="時尚">時尚</option>
                                <option value="書籍">書籍</option>
                                <option value="玩具">玩具</option>
                            </select>
                        </div>
                        <div class="flex items-center justify-between bg-gray-50 p-4 rounded-2xl">
                            <span class="text-sm font-bold text-gray-400">評分</span>
                            <div id="star-rating-container" class="flex gap-2">
                                <!-- 星星將透過 JS 生成 -->
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-black text-white py-5 rounded-2xl font-black text-lg hover:shadow-lg transition-all active:scale-[0.98]">
                        確認儲存
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK & 核心邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, addDoc, onSnapshot, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyASJgmUwOmi-ilffNSeCLjGomNyK1Ct06g",
            authDomain: "sungchinisgay.firebaseapp.com",
            projectId: "sungchinisgay",
            storageBucket: "sungchinisgay.firebasestorage.app",
            messagingSenderId: "728176549000",
            appId: "1:728176549000:web:9181ad5b8365374a65d33d",
            measurementId: "G-HWCDKK6XTW"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // 初始化 Lucide Icons
        lucide.createIcons();

        // 狀態變數
        let currentUser = null;
        let itemsData = [];
        let currentSearchQuery = "";
        let newRating = 5;
        let newImageBase64 = null;
        let unsubscribeSnapshot = null;

        // DOM 元素參考
        const screens = {
            loading: document.getElementById('loading-screen'),
            login: document.getElementById('login-screen'),
            main: document.getElementById('main-app')
        };
        const modal = document.getElementById('add-modal');
        const itemsGrid = document.getElementById('items-grid');
        
        // 介面切換邏輯
        function showScreen(screenName) {
            screens.loading.classList.add('hidden-view');
            screens.login.classList.add('hidden-view');
            screens.main.classList.add('hidden-view');
            screens[screenName].classList.remove('hidden-view');
        }

        // 1. 身分驗證邏輯
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                // 更新使用者 UI
                document.getElementById('user-name').textContent = user.displayName || '用戶';
                if(user.photoURL) document.getElementById('user-avatar').src = user.photoURL;
                
                showScreen('main');
                listenToFirestore();
            } else {
                if (unsubscribeSnapshot) unsubscribeSnapshot();
                itemsData = [];
                showScreen('login');
            }
        });

        document.getElementById('btn-login').addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                console.error("登入失敗", error);
                alert("登入失敗或被瀏覽器阻擋。若您在預覽視窗中，請將程式碼複製到本地端執行。");
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => signOut(auth));

        // 2. 監聽 Firestore
        function listenToFirestore() {
            const collectionRef = collection(db, 'users', currentUser.uid, 'items');
            const q = query(collectionRef);

            unsubscribeSnapshot = onSnapshot(q, (snapshot) => {
                itemsData = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                // 由新到舊排序
                itemsData.sort((a, b) => b.createdAt - a.createdAt);
                renderItems();
                updateStats();
            }, (error) => {
                console.error("Firestore Error:", error);
            });
        }

        // 3. 渲染列表
        function renderItems() {
            itemsGrid.innerHTML = ''; // 清空
            
            const filteredItems = itemsData.filter(item => 
                item.name.toLowerCase().includes(currentSearchQuery.toLowerCase())
            );

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = "group bg-white rounded-[2.5rem] overflow-hidden border border-gray-100 shadow-sm hover:shadow-2xl transition-all duration-500 hover:-translate-y-2";
                
                // 圖片區塊
                let imageHTML = item.image 
                    ? `<img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover" />`
                    : `<div class="w-full h-full flex flex-col items-center justify-center text-gray-200"><i data-lucide="image" class="w-12 h-12"></i></div>`;

                card.innerHTML = `
                    <div class="relative aspect-[4/3] bg-gray-50 overflow-hidden">
                        ${imageHTML}
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <button data-delete-id="${item.id}" class="delete-btn p-3 bg-white/20 backdrop-blur-md rounded-full text-white hover:bg-red-500 transition-all">
                                <i data-lucide="trash-2" class="w-5 h-5 pointer-events-none"></i>
                            </button>
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-[10px] font-bold text-blue-500 uppercase tracking-tighter">${item.category}</span>
                            <div class="flex items-center text-amber-500">
                                <i data-lucide="star" class="w-3 h-3 fill-current"></i>
                                <span class="text-xs font-bold ml-1">${item.rating}.0</span>
                            </div>
                        </div>
                        <h3 class="text-lg font-bold truncate mb-4">${item.name}</h3>
                        <div class="flex items-baseline gap-1">
                            <span class="text-xs font-bold text-gray-400">NT$</span>
                            <span class="text-xl font-black">${item.price.toLocaleString()}</span>
                        </div>
                    </div>
                `;
                itemsGrid.appendChild(card);
            });

            // 加入「新增按鈕」佔位卡片
            const addBtnCard = document.createElement('button');
            addBtnCard.className = "border-2 border-dashed border-gray-200 rounded-[2.5rem] min-h-[300px] flex flex-col items-center justify-center text-gray-400 hover:border-black hover:text-black transition-all group";
            addBtnCard.innerHTML = `
                <i data-lucide="plus-circle" class="w-12 h-12 mb-3 group-hover:scale-110 transition-transform"></i>
                <p class="font-bold">新增收藏項目</p>
            `;
            addBtnCard.addEventListener('click', openModal);
            itemsGrid.appendChild(addBtnCard);

            // 重新初始化卡片內的 Icons
            lucide.createIcons({ root: itemsGrid });
        }

        // 4. 更新數據統計
        function updateStats() {
            const totalCount = itemsData.length;
            const totalValue = itemsData.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
            const avgRating = totalCount > 0 
                ? (itemsData.reduce((sum, item) => sum + item.rating, 0) / totalCount).toFixed(1) 
                : 0;

            document.getElementById('stat-count').textContent = `${totalCount} 件`;
            document.getElementById('stat-value').textContent = `$${totalValue.toLocaleString()}`;
            document.getElementById('stat-rating').textContent = `${avgRating} / 5.0`;
        }

        // 5. 搜尋功能
        document.getElementById('search-input').addEventListener('input', (e) => {
            currentSearchQuery = e.target.value;
            renderItems();
        });

        // 6. Modal 與表單邏輯
        const openModal = () => {
            modal.classList.remove('hidden-view');
            resetForm();
            renderStarRating();
        };
        const closeModal = () => modal.classList.add('hidden-view');

        document.getElementById('btn-open-modal').addEventListener('click', openModal);
        document.getElementById('btn-close-modal').addEventListener('click', closeModal);
        document.getElementById('modal-overlay').addEventListener('click', closeModal);

        // 渲染星星評分
        function renderStarRating() {
            const container = document.getElementById('star-rating-container');
            container.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');
                star.setAttribute('data-lucide', 'star');
                star.className = `w-6 h-6 cursor-pointer ${newRating >= i ? 'text-amber-500 fill-current' : 'text-gray-200'}`;
                star.addEventListener('click', () => {
                    newRating = i;
                    renderStarRating(); // 重新渲染星星狀態
                });
                container.appendChild(star);
            }
            lucide.createIcons({ root: container });
        }

        // 圖片上傳預覽
        const imgInput = document.getElementById('img-input');
        const imgContainer = document.getElementById('image-upload-container');
        const imgPlaceholder = document.getElementById('image-placeholder');
        const imgPreview = document.getElementById('image-preview');

        imgContainer.addEventListener('click', () => imgInput.click());

        imgInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                if (file.size > 800000) {
                    alert("檔案過大，請上傳小於 800KB 的圖片！");
                    return;
                }
                const reader = new FileReader();
                reader.onloadend = () => {
                    newImageBase64 = reader.result;
                    imgPreview.src = newImageBase64;
                    imgPreview.classList.remove('hidden-view');
                    imgPlaceholder.classList.add('hidden-view');
                };
                reader.readAsDataURL(file);
            }
        });

        function resetForm() {
            document.getElementById('add-form').reset();
            newRating = 5;
            newImageBase64 = null;
            imgPreview.src = "";
            imgPreview.classList.add('hidden-view');
            imgPlaceholder.classList.remove('hidden-view');
        }

        // 新增資料到 Firestore
        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('input-name').value;
            const price = document.getElementById('input-price').value;
            const category = document.getElementById('input-category').value;

            if (!name || !price || !currentUser) return;

            try {
                const collectionRef = collection(db, 'users', currentUser.uid, 'items');
                await addDoc(collectionRef, {
                    name,
                    price: parseFloat(price),
                    rating: newRating,
                    category,
                    image: newImageBase64,
                    createdAt: Date.now()
                });
                closeModal();
            } catch (error) {
                console.error("Error adding document: ", error);
            }
        });

        // 7. 刪除邏輯 (使用事件委派)
        itemsGrid.addEventListener('click', async (e) => {
            const deleteBtn = e.target.closest('.delete-btn');
            if (deleteBtn && currentUser) {
                const docId = deleteBtn.getAttribute('data-delete-id');
                try {
                    const docRef = doc(db, 'users', currentUser.uid, 'items', docId);
                    await deleteDoc(docRef);
                } catch (error) {
                    console.error("Error deleting document: ", error);
                }
            }
        });

    </script>
</body>
</html>
